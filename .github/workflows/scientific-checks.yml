name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full offline finite campaign and retained fail gates
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONOPTIMIZE
          ulimit -v 3145728
          ulimit -t 600
          mkdir -p scientific-output
          # One whole-run wall bound, inherited per-process CPU/address bounds,
          # and the existing 35-CPU-second / 40-second core child bounds.
          timeout --signal=TERM --kill-after=10s 600s \
            python -B reproduce.py 2>&1 | tee scientific-output/full-run.log
      - name: Upload raw output even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: |
            scientific-output/
            results/
            inputs/
            certificates/
          if-no-files-found: error
          retention-days: 14
